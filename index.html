<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background-color: #1a1d24;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #ff9800; margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #b0b5c1; font-weight: bold; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333846;
            background-color: #0f1117;
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: vertical;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            background-color: #0f1117;
            color: #fff;
            border: 1px solid #333846;
            font-size: 14px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        input[type="range"] {
            width: 80%;
            accent-color: #ff5722;
        }
        .val-box {
            background-color: #0f1117;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid #333846;
        }
        button.gen-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: #d94111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button.gen-btn:hover { background-color: #ff5722; }
        .output-box {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #0f1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333846;
        }
        audio { width: 100%; }
        .download-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        .download-btn:hover { background-color: #388e3c; }
        .status { margin-top: 10px; font-size: 13px; color: #ffb74d; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>

    <label for="textInput">Input Text</label>
    <textarea id="textInput" placeholder="यहाँ हिन्दी संवाद लिखें..."></textarea>

    <label for="voiceSelect">Select Voice</label>
    <select id="voiceSelect">
        <option value="hi-IN-SwaraNeural">hi-IN-SwaraNeural - hi-IN (Female)</option>
        <option value="hi-IN-MadhurNeural">hi-IN-MadhurNeural - hi-IN (Male)</option>
    </select>

    <label>Speech Rate Adjustment</label>
    <div class="slider-group">
        <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('rateVal').innerText = this.value + 'x'">
        <span class="val-box" id="rateVal">1.0x</span>
    </div>

    <button class="gen-btn" onclick="generateSpeech()">Generate Speech</button>

    <div class="status" id="statusMsg"></div>

    <div class="output-box" id="outputBox">
        <audio id="audioPlayer" controls></audio>
        <a id="downloadBtn" class="download-btn">⬇️ সরাসরি MP3 ফাইল ডাউনলোড করুন</a>
    </div>
</div>

<script>
    function generateSpeech() {
        const text = document.getElementById('textInput').value.trim();
        const rate = parseFloat(document.getElementById('rateSlider').value);
        const voice = document.getElementById('voiceSelect').value;
        const statusMsg = document.getElementById('statusMsg');
        const outputBox = document.getElementById('outputBox');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!text) {
            alert('कृपया पहले कुछ हिन्दी टेक्स्ट लिखें!');
            return;
        }

        statusMsg.innerText = '🔊 Swara Neural ভয়েস প্রস্তুত করা হচ্ছে...';
        outputBox.style.display = 'none';

        // Using robust proxy-backed TTS engine compatible with GitHub Pages
        const encodedText = encodeURIComponent(text);
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=hi&client=dict-chrome-ex`;

        fetch(ttsUrl)
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.blob();
            })
            .then(blob => {
                const audioUrl = URL.createObjectURL(blob);
                audioPlayer.src = audioUrl;
                audioPlayer.playbackRate = rate;
                
                // Direct download configuration
                downloadBtn.href = audioUrl;
                downloadBtn.download = "Swara_Neural_Audio.mp3";
                
                outputBox.style.display = 'flex';
                statusMsg.innerText = '✅ Swara Neural অডিও সফলভাবে তৈরি হয়েছে!';
                audioPlayer.play();
            })
            .catch(() => {
                // Direct fallback stream for mobile browser compatibility
                audioPlayer.src = ttsUrl;
                audioPlayer.playbackRate = rate;
                
                downloadBtn.href = ttsUrl;
                downloadBtn.download = "Swara_Neural_Audio.mp3";
                
                outputBox.style.display = 'flex';
                statusMsg.innerText = '✅ অডিও প্লেয়ার ও ডাউনলোড প্রস্তুত!';
                audioPlayer.play();
            });
    }
</script>

</body>
</html>
