<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #555; }
        audio { margin-top: 25px; width: 100%; max-width: 500px; }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>

    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়ালগ পেস্ট করুন..."></textarea>
    <br>
    <button id="genBtn" onclick="generateTTS()">অডিও তৈরি করুন</button>

    <br>
    <audio id="audioPlayer" controls style="display:none;"></audio>
    <br>
    <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadAudio()">⬇️ MP3 ডাউনলোড করুন</button>

    <script>
        let currentAudioUrl = '';

        async function generateTTS() {
            const text = document.getElementById('textInput').value.trim();
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!text) {
                alert('অনুগ্রহ করে কিছু হিন্দি লেখা লিখুন!');
                return;
            }

            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=hi&client=tw-ob`;

            try {
                const response = await fetch(ttsUrl);
                const blob = await response.blob();
                currentAudioUrl = URL.createObjectURL(blob);

                audioPlayer.src = currentAudioUrl;
                audioPlayer.style.display = 'block';
                audioPlayer.play();

                downloadBtn.style.display = 'inline-block';
            } catch (err) {
                alert('অডিও তৈরি করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            }
        }

        function downloadAudio() {
            if (!currentAudioUrl) return;
            const a = document.createElement('a');
            a.href = currentAudioUrl;
            a.download = 'hindi_drama_voice.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
