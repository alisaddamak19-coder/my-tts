<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিন্দি ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #ff9800; }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #e64a19; }
        .status { margin-top: 20px; font-weight: bold; color: #4caf50; text-align: center; }
    </style>
</head>
<body>

    <h2>হিন্দি ভয়েস জেনারেটর</h2>

    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়ালগ লিখুন (যেমন: तुम मुझे कभी नहीं समझ पाओगे!)..."></textarea>
    <br>
    <button onclick="playHindiVoice()">ভয়েস শুনুন</button>

    <div id="statusMsg" class="status"></div>

    <script>
        function playHindiVoice() {
            const text = document.getElementById('textInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!text) {
                alert('অনুগ্রহ করে বক্সে কিছু হিন্দি লেখা লিখুন!');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('আপনার ব্রাউজার এই ভয়েস ফিচারটি সাপোর্ট করছে না!');
                return;
            }

            // আগের কোনো ভয়েস চললে তা বন্ধ করে দেওয়া
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN'; // একদম নিখুঁত ভারতীয় হিন্দি ভয়েস
            utterance.rate = 1.0; // স্বাভাবিক গতি

            statusMsg.innerText = '🔊 ভয়েস বাজানো হচ্ছে...';

            utterance.onend = function() {
                statusMsg.innerText = '✅ বলা সম্পন্ন হয়েছে!';
            };

            utterance.onerror = function() {
                statusMsg.innerText = '❌ ভয়েস চালাতে সমস্যা হয়েছে।';
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
