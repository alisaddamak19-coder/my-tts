<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #555; }
        .info { margin-top: 20px; color: #4caf50; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>আমার হিন্দি ভয়েস জেনারেটর</h2>

    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়ালগ লিখুন..."></textarea>
    <br>
    <button id="genBtn" onclick="speakHindi()">ভয়েস শুনুন</button>

    <div id="status" class="info"></div>

    <script>
        function speakHindi() {
            const text = document.getElementById('textInput').value.trim();
            const status = document.getElementById('status');

            if (!text) {
                alert('অনুগ্রহ করে কিছু হিন্দি লেখা লিখুন!');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('আপনার ব্রাউজার স্পিচ সিন্থেসিস সমর্থন করে না!');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN'; // Hindi (India) voice
            utterance.rate = 1.0; // Normal speed

            status.innerText = '🔊 ভয়েস বাজানো হচ্ছে...';

            utterance.onend = function() {
                status.innerText = '✅ বলা সম্পন্ন হয়েছে!';
            };

            utterance.onerror = function() {
                status.innerText = '❌ কোনো সমস্যা হয়েছে।';
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
