<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #555; }
        audio { margin-top: 25px; width: 100%; max-width: 500px; }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>

    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়ালগ পেস্ট করুন..."></textarea>
    <br>
    <button id="genBtn" onclick="generateTTS()">অডিও তৈরি করুন</button>

    <br>
    <audio id="audioPlayer" controls style="display:none;"></audio>
    <br>
    <a id="downloadBtn" class="download-btn" style="display:none;">⬇️ MP3 ডাউনলোড করুন</a>

    <script>
        async function generateTTS() {
            const text = document.getElementById('textInput').value.trim();
            const btn = document.getElementById('genBtn');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!text) {
                alert('অনুগ্রহ করে কিছু হিন্দি লেখা লিখুন!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'অডিও তৈরি হচ্ছে...';
            audioPlayer.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                const proxyUrl = 'https://corsproxy.io/?';
                const apiUrl = encodeURIComponent('https://tts.travisvn.com/api/tts');
                
                const response = await fetch(proxyUrl + apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        voice: 'hi-IN-SwaraNeural'
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const blob = await response.blob();
                const audioBlob = new Blob([blob], { type: 'audio/mp3' });
                const audioUrl = URL.createObjectURL(audioBlob);

                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';

                downloadBtn.href = audioUrl;
                downloadBtn.download = 'drama_voice.mp3';
                downloadBtn.style.display = 'inline-block';

            } catch (err) {
                const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=hi&client=tw-ob`;
                
                audioPlayer.src = googleTtsUrl;
                audioPlayer.style.display = 'block';

                downloadBtn.href = googleTtsUrl;
                downloadBtn.download = 'drama_voice.mp3';
                downloadBtn.target = '_blank';
                downloadBtn.style.display = 'inline-block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'অডিও তৈরি করুন';
            }
        }
    </script>

</body>
</html>
