<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Swara Neural TTS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: white; text-align: center; }
        textarea { width: 90%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
        button { background: #ff5722; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; margin-top: 15px; cursor: pointer; }
        audio { margin-top: 20px; width: 90%; }
    </style>
</head>
<body>
    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>
    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়লগ পেস্ট করুন..."></textarea><br>
    <button onclick="generateSpeech()">অডিও তৈরি করুন</button>
    <div id="audioContainer"></div>

    <script>
        async function generateSpeech() {
            const text = document.getElementById('textInput').value;
            if(!text) { alert('দয়া করে কিছু হিন্দি টেক্সট লিখুন!'); return; }
            
            const btn = document.querySelector('button');
            btn.innerText = 'তৈরি হচ্ছে...';
            btn.disabled = true;

            try {
                const response = await fetch(`https://tts.travisvn.com/api/tts?text=${encodeURIComponent(text)}&voice=hi-IN-SwaraNeural`);
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                document.getElementById('audioContainer').innerHTML = `
                    <br><audio controls src="${audioUrl}" autoplay></audio><br><br>
                    <a href="${audioUrl}" download="drama_voice.mp3" style="color: #4CAF50; font-size: 18px; text-decoration: none;">⬇️ MP3 ডাউনলোড করুন</a>
                `;
            } catch (err) {
                alert('ভয়েস তৈরি করতে সমস্যা হয়েছে! আবার চেষ্টা করুন।');
            }
            btn.innerText = 'অডিও তৈরি করুন';
            btn.disabled = false;
        }
    </script>
</body>
</html>
