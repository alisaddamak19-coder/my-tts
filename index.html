<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #ff9800; }
        textarea {
            width: 100%;
            max-width: 500px;
            height: 130px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .controls {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-size: 14px; color: #bbb; }
        select {
            padding: 8px;
            border-radius: 5px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
        }
        button {
            margin-top: 15px;
            width: 100%;
            max-width: 500px;
            padding: 12px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #e64a19; }
        audio { margin-top: 20px; width: 100%; max-width: 500px; }
        .download-btn {
            display: block;
            margin-top: 15px;
            width: 100%;
            max-width: 500px;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>

    <textarea id="textInput" placeholder="এখানে হিন্দি ডায়ালগ লিখুন..."></textarea>
    
    <div class="controls">
        <div>
            <label for="speedSelect">স্পিড (গতি):</label>
            <select id="speedSelect">
                <option value="0.8">ধীর (0.8x)</option>
                <option value="1.0" selected>স্বাভাবিক (1.0x)</option>
                <option value="1.2">দ্রুত (1.2x)</option>
            </select>
        </div>
    </div>

    <button onclick="generateVoice()">অডিও তৈরি ও ডাউনলোড অপশন আনুন</button>

    <audio id="audioPlayer" controls style="display:none;"></audio>
    <a id="downloadBtn" class="download-btn" style="display:none;" target="_blank">⬇️ MP3 ফাইল ডাউনলোড করুন</a>

    <script>
        function generateVoice() {
            const text = document.getElementById('textInput').value.trim();
            const speed = document.getElementById('speedSelect').value;
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!text) {
                alert('অনুগ্রহ করে কিছু হিন্দি লেখা লিখুন!');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('আপনার ব্রাউজার এই ভয়েস ফিচারটি সাপোর্ট করছে না!');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = parseFloat(speed);

            // Web Speech API দিয়ে অডিও রেকর্ড বা ব্লব তৈরি করে ডাউনলোডের ব্যবস্থা করার জন্য একটি লাইভ সেশন তৈরি করা হচ্ছে
            // যেহেতু ব্রাউজারের নিজস্ব ভয়েস সরাসরি MP3 ফাইলে কনভার্ট করা কঠিন, তাই আমরা প্লে করার পাশাপাশি নিচে রিয়েল-টাইম কন্ট্রোল দিচ্ছি।
            
            window.speechSynthesis.speak(utterance);
            
            alert('ভয়েস বাজানো শুরু হয়েছে! আপনি চাইলে আপনার ফোনের স্ক্রিন রেকর্ডার বা থার্ড-পার্টি টুল দিয়ে এটি ক্যাপচার করতে পারেন, অথবা আমরা Hugging Face এর API লিংক এখানে যুক্ত করে দিতে পারি।');
        }
    </script>

</body>
</html>
