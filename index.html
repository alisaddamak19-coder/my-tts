<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background-color: #1a1d24;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #ff9800; margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #b0b5c1; font-weight: bold; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333846;
            background-color: #0f1117;
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: vertical;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            background-color: #0f1117;
            color: #fff;
            border: 1px solid #333846;
            font-size: 14px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #ff5722;
        }
        .val-box {
            background-color: #0f1117;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid #333846;
            min-width: 55px;
            text-align: center;
        }
        button.gen-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: #d94111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button.gen-btn:hover { background-color: #ff5722; }
        .output-box {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #0f1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333846;
        }
        audio { width: 100%; }
        .download-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .download-btn:hover { background-color: #388e3c; }
        .status { margin-top: 10px; font-size: 13px; color: #ffb74d; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>আমার হিন্দি Swara Neural ভয়েস জেনারেটর</h2>

    <label for="textInput">Input Text</label>
    <textarea id="textInput" placeholder="यहाँ हिन्दी संवाद लिखें..."></textarea>

    <label for="voiceSelect">Select Voice</label>
    <select id="voiceSelect">
        <option value="hi-IN-SwaraNeural">hi-IN-SwaraNeural - hi-IN (Female)</option>
        <option value="hi-IN-MadhurNeural">hi-IN-MadhurNeural - hi-IN (Male)</option>
    </select>

    <label>Speech Rate Adjustment (%)</label>
    <div class="slider-row">
        <input type="range" id="rateSlider" min="-50" max="100" value="0" oninput="document.getElementById('rateVal').innerText = this.value">
        <span class="val-box" id="rateVal">0</span>
    </div>

    <label>Pitch Adjustment (Hz)</label>
    <div class="slider-row">
        <input type="range" id="pitchSlider" min="-20" max="20" value="0" oninput="document.getElementById('pitchVal').innerText = this.value">
        <span class="val-box" id="pitchVal">0</span>
    </div>

    <button class="gen-btn" onclick="generateSpeech()">Generate Speech</button>

    <div class="status" id="statusMsg"></div>

    <div class="output-box" id="outputBox">
        <audio id="audioPlayer" controls></audio>
        <a id="downloadBtn" class="download-btn">⬇️ সরাসরি MP3 ফাইল ডাউনলোড করুন</a>
    </div>
</div>

<script>
    function generateSpeech() {
        const text = document.getElementById('textInput').value.trim();
        const rateVal = parseInt(document.getElementById('rateSlider').value);
        const pitchVal = parseInt(document.getElementById('pitchSlider').value);
        const statusMsg = document.getElementById('statusMsg');
        const outputBox = document.getElementById('outputBox');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!text) {
            alert('कृपया पहले कुछ हिन्दी टेक्स्ट लिखें!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('আপনার ব্রাউজার এই ভয়েস ফিচারটি সমর্থন করছে না।');
            return;
        }

        statusMsg.innerText = '🔊 Swara Neural ভয়েস তৈরি হচ্ছে...';
        outputBox.style.display = 'none';

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';

        // Convert percentage slider to rate multiplier (e.g. rate 0% = 1.0, 50% = 1.5, -50% = 0.5)
        utterance.rate = Math.max(0.1, (100 + rateVal) / 100);
        
        // Convert pitch slider (-20 to 20) to browser pitch (0.1 to 2.0)
        utterance.pitch = Math.max(0.1, Math.min(2.0, 1.0 + (pitchVal / 20)));

        // Attempt to find natural/neural Hindi voice if available in browser
        const voices = window.speechSynthesis.getVoices();
        const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
        if (hindiVoice) {
            utterance.voice = hindiVoice;
        }

        // Using MediaRecorder to capture speech output as an actual downloadable audio blob/mp3 format
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();
            const mediaRecorder = new MediaRecorder(dest.stream);
            let chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/mp3' });
                const audioUrl = URL.createObjectURL(blob);
                audioPlayer.src = audioUrl;
                downloadBtn.href = audioUrl;
                downloadBtn.download = `Swara_Neural_Audio.mp3`;
                outputBox.style.display = 'flex';
                statusMsg.innerText = '✅ অডিও সফলভাবে তৈরি হয়েছে এবং ডাউনলোড প্রস্তুত!';
            };

            mediaRecorder.start();
            window.speechSynthesis.speak(utterance);

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

        } catch (err) {
            // Fallback normal playback if MediaRecorder stream is restricted by mobile browser
            window.speechSynthesis.speak(utterance);
            statusMsg.innerText = '✅ ভয়েস বাজানো শুরু হয়েছে!';
            outputBox.style.display = 'none';
        }
    }

    // Preload voices
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
</script>

</body>
</html>
